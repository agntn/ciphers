name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.10.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      # One install covers docs/: test/unit/docs-mcp.test.ts loads the /mcp handler from there.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:packed
      # pnpm pack swaps catalog: specs for versions. npm publish alone would ship them raw.
      - run: pnpm pack --out ciphers.tgz
      - run: npm publish ./ciphers.tgz --access public
