packages:
  - docs

allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob keeps CI green the day a sibling ships.
minimumReleaseAgeExclude:
  - '@agntn/*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

# One version per name for the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    '@agntn/compressions': 0.1.1
    '@agntn/encodings': 0.2.0
    '@agntn/hashes': 0.6.7
    '@agntn/tools': 0.2.4
    '@modelcontextprotocol/sdk': 1.32.2
    '@modelcontextprotocol/server': 2.4.0
    '@nuxtjs/mcp-toolkit': 0.24.3
    '@vueuse/core': 14.4.0
    agents: 0.33.0
    better-sqlite3: 12.11.1
    docus: 5.15.0
    nuxt: 4.6.3
    ufo: 1.6.4
    zod: 4.6.7
  dev:
    '@agntn/ox': 0.1.0
    '@earendil-works/pi-coding-agent': latest
    '@earendil-works/pi-tui': latest
    '@iconify-json/lucide': 1.2.149
    '@iconify-json/simple-icons': 1.2.101
    '@iconify-json/vscode-icons': 1.2.94
    '@modelcontextprotocol/client': 2.4.0
    '@nuxt/content': 3.16.2
    '@nuxt/ui': 4.12.0
    '@oh-my-pi/pi-coding-agent': 18.4.12
    '@types/node': latest
    ai: 7.0.159
    obuild: 0.4.45
    shiki: 4.6.0
    tsx: 4.23.15
    typebox: 1.4.4
    typescript: 6.0.3
    wrangler: 4.157.0

cleanupUnusedCatalogs: true

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
